server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Astro genera /ruta/index.html: servir la carpeta cuando el URI es una ruta
    # (con 301 a la barra final), pero devolver 404 real si no existe.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # Una sola cabecera Cache-Control: 'expires' añadiría otra.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/ld+json;
}
